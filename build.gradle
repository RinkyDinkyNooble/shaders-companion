plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Dev-only checks (see README): loaded in the dev runs, never packed into the jar.
sourceSets {
    verify {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            // Oculus and Embeddium ship production names, so the dev runs remap their mixins.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source sourceSets.verify
                }
            }
        }
        client {
            // gradlew runClient -PdevDump=300: makes a world, saves the cube after 300 drawn frames, then quits.
            if (project.hasProperty('devDump')) {
                property 'shaderscompanion.devDump', project.property('devDump')
            }
            // -PdevLift=0 keeps the player on the ground (default: 60 blocks up).
            if (project.hasProperty('devLift')) {
                property 'shaderscompanion.devLift', project.property('devLift')
            }
            // -PdevScene=pool: a water pool under a ceiling, screenshotted with the mod on and off; mobs: still mobs around the camera.
            if (project.hasProperty('devScene')) {
                property 'shaderscompanion.devScene', project.property('devScene')
            }
            // -PdevWait=1200: ticks the scenes wait before saving (160 by default; Distant Horizons needs about 1200).
            if (project.hasProperty('devWait')) {
                property 'shaderscompanion.devWait', project.property('devWait')
            }
            // -PdevQuit: logs the status at the title screen and quits (for checking the bundled pack's install).
            if (project.hasProperty('devQuit')) {
                property 'shaderscompanion.devQuit', 'true'
            }
            // -PdevPitch=25: how far the pool scene looks down, in degrees (50 by default).
            if (project.hasProperty('devPitch')) {
                property 'shaderscompanion.devPitch', project.property('devPitch')
            }
            // -PdevYaw=90: which way the ocean scene looks, in degrees (by default the way the ocean runs farthest).
            if (project.hasProperty('devYaw')) {
                property 'shaderscompanion.devYaw', project.property('devYaw')
            }
            // -PdevToggle=WATER_WAVE_FILTER: a shader pack on/off option (or config.<name>, the mod's own) timed in alternating rounds.
            if (project.hasProperty('devToggle')) {
                property 'shaderscompanion.devToggle', project.property('devToggle')
            }
            // -PdevBurst=6: shots per -PdevToggle round, on consecutive ticks (flicker shows as change between them).
            if (project.hasProperty('devBurst')) {
                property 'shaderscompanion.devBurst', project.property('devBurst')
            }
            // -PdevNoFacade: the shore scene without its glass facade (the water is mirrored).
            if (project.hasProperty('devNoFacade')) {
                property 'shaderscompanion.devNoFacade', 'true'
            }
            // -PdevTime=15000: the time of day of the ocean and shore scenes (6000, noon, by default).
            if (project.hasProperty('devTime')) {
                property 'shaderscompanion.devTime', project.property('devTime')
            }
            // -PdevTag=p19: a name for the bright scene's screenshots.
            if (project.hasProperty('devTag')) {
                property 'shaderscompanion.devTag', project.property('devTag')
            }
            // -PdevBoat=minecraft:oak_boat: the boat scene's vehicle (Superb Warfare's speed boat by default, with -PdevSbw).
            if (project.hasProperty('devBoat')) {
                property 'shaderscompanion.devBoat', project.property('devBoat')
            }
            // -PdevGlass: the ocean scene surrounded by light grey stained glass (water seen through glass).
            if (project.hasProperty('devGlass')) {
                property 'shaderscompanion.devGlass', 'true'
            }
            // -PdevTacz: TaCZ loaded (see dependencies); the mirror scene then holds a gun and wears armour, and every
            // render type the entity capture is asked for is logged.
            if (project.hasProperty('devTacz')) {
                property 'shaderscompanion.devTacz', 'true'
                property 'shaderscompanion.logTypes', 'true'
            }
            // -PdevNoShaders: scenes start without waiting for the mod to draw (for a run with shaders turned off).
            if (project.hasProperty('devNoShaders')) {
                property 'shaderscompanion.devNoShaders', 'true'
            }
            // -PdevRain: rain from 30 ticks into a scene (the ocean scene's biome has rain).
            if (project.hasProperty('devRain')) {
                property 'shaderscompanion.devRain', 'true'
            }
            // -PdevJfr=research/city.jfr: a Java Flight Recorder profile of the run, for finding CPU costs.
            if (project.hasProperty('devJfr')) {
                jvmArg "-XX:StartFlightRecording=filename=${project.file(project.property('devJfr'))},settings=profile"
            }
            // -PdevSize=1920x1009: the game window's size (854 x 480 by default).
            if (project.hasProperty('devSize')) {
                var size = project.property('devSize').toString().split('x')
                args '--width', size[0], '--height', size[1]
            }
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

repositories {
    // Oculus and Embeddium are read from libs/ (see README).
    flatDir { dir 'libs' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Compiled against, and loaded in the dev runs. Never packed into this mod's jar.
    implementation fg.deobf("local:oculus:${oculus_version}")
    implementation fg.deobf("local:embeddium:${embeddium_version}")
    // Distant Horizons is optional: compiled against for its LOD buffers (only its own classes are used), loaded in
    // dev runs only with -PdevDh.
    compileOnly files("libs/distanthorizons-${distanthorizons_version}.jar")
    if (project.hasProperty('devDh')) {
        runtimeOnly fg.deobf("local:distanthorizons:${distanthorizons_version}")
    }
    // Superb Warfare is loaded in dev runs only with -PdevSbw (the boat scene): its jar without the nested ones, and
    // the mods it needs (SimpleBedrockModel, GeckoLib, Curios, Cloth Config, Ponder, Flywheel) remapped, its script
    // library as it is. Kotlin for Forge goes in run/mods. HANDOFF "Build and test" says where each jar comes from.
    if (project.hasProperty('devSbw')) {
        runtimeOnly fg.deobf("local:superbwarfare:0.8.9.2")
        runtimeOnly fg.deobf("local:simplebedrockmodel:2.5.1")
        runtimeOnly fg.deobf("local:geckolib:4.8.4")
        runtimeOnly fg.deobf("local:curios:5.14.1")
        runtimeOnly fg.deobf("local:clothconfig:11.1.136")
        runtimeOnly fg.deobf("local:ponder:1.0.91")
        runtimeOnly fg.deobf("local:flywheel:1.0.5")
        minecraftLibrary files('libs/rhino-1.8.1-SNAPSHOT.jar')
    }
    // TaCZ is loaded in dev runs only with -PdevTacz: its jar without the nested ones, SimpleBedrockModel remapped (the
    // version the instance resolves), its script and maths libraries as they are. MixinExtras comes with Forge.
    if (project.hasProperty('devTacz')) {
        runtimeOnly fg.deobf("local:tacz:1.1.8")
        if (!project.hasProperty('devSbw')) {
            runtimeOnly fg.deobf("local:simplebedrockmodel:2.5.1")
        }
        minecraftLibrary files('libs/luaj-core-3.0.8.jar', 'libs/luaj-jse-3.0.8.jar', 'libs/commons-math3-3.6.1.jar', 'libs/bcel-6.6.1.jar')
    }
}

tasks.named('processResources', ProcessResources).configure {
    // The bundled shader pack (see gradle.properties), stored without spaces in its name
    var bundledPack = file("${bundled_pack_dir}/ABZA Shader v${bundled_pack_version}.zip")
    inputs.property 'bundled_pack_version', bundled_pack_version
    doFirst {
        if (!bundledPack.isFile()) {
            throw new GradleException("The bundled shader pack is missing: ${bundledPack}. Build it in the ABZA Shader repo (python tools/build.py ${bundled_pack_version}) or set bundled_pack_version.")
        }
    }
    from(bundledPack) {
        into 'bundled'
        rename { 'abza-shader.zip' }
    }
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            oculus_version_range: oculus_version_range, embeddium_version_range: embeddium_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
            mod_version: mod_version, mod_authors: mod_authors, mod_description: mod_description,
            mod_url: mod_url, mod_issues: mod_issues, bundled_pack_version: bundled_pack_version,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'bundled/pack.properties']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors,
                'MixinConfigs'            : "${mod_id}.mixins.json",
        ])
    }
    from('LICENSE') {
        rename { "LICENSE_${mod_id}" }
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// The mixin refmap is written only when the mixin classes are compiled, and deleted every time compileJava runs. An
// incremental compile that recompiles nothing (a build after a run with -PdevSbw, which changes the classpath) left
// the jar without it: 0.6.4 loaded, but its frame hook never attached outside the dev client. So always compile in
// full, compile again when the refmap is gone, and stop the build if the jar's refmap is missing or doesn't name the
// game's own methods.
tasks.named('compileJava', JavaCompile).configure {
    options.incremental = false
    var refmap = new File(temporaryDir, "${mod_id}.refmap.json")
    outputs.upToDateWhen { refmap.isFile() }
}

tasks.register('checkJar') {
    dependsOn 'jar', 'reobfJar'
    doLast {
        var jarFile = tasks.named('jar', Jar).get().archiveFile.get().asFile
        var refmapName = "${mod_id}.refmap.json"
        var zip = new java.util.zip.ZipFile(jarFile)
        try {
            var entry = zip.getEntry(refmapName)
            if (entry == null) {
                throw new GradleException("${jarFile.name} has no ${refmapName}: its mixins would do nothing in the real game. Run gradlew clean build.")
            }
            var refmap = zip.getInputStream(entry).getText('UTF-8')
            // GameRenderer.renderLevel and LevelRenderer.renderLevel, the frame hook's method and call; RenderBuffers.bufferSource
            for (name in ['m_109089_', 'm_109599_', 'm_110104_']) {
                if (!refmap.contains(name)) {
                    throw new GradleException("${refmapName} in ${jarFile.name} doesn't map ${name}: the frame hook would not attach in the real game.")
                }
            }
        } finally {
            zip.close()
        }
        logger.lifecycle("checkJar: ${jarFile.name} has its mixin refmap.")
    }
}

tasks.named('build').configure {
    dependsOn 'checkJar'
}
