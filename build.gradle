plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Dev-only checks (see README): loaded in the dev runs, never packed into the jar.
sourceSets {
    verify {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            // Oculus and Embeddium ship production names, so the dev runs remap their mixins.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source sourceSets.verify
                }
            }
        }
        client {
            // gradlew runClient -PdevDump=300: makes a world, saves the cube after 300 drawn frames, then quits.
            if (project.hasProperty('devDump')) {
                property 'shaderscompanion.devDump', project.property('devDump')
            }
            // -PdevLift=0 keeps the player on the ground (default: 60 blocks up).
            if (project.hasProperty('devLift')) {
                property 'shaderscompanion.devLift', project.property('devLift')
            }
            // -PdevScene=pool: a water pool under a ceiling, screenshotted with the mod on and off; mobs: still mobs around the camera.
            if (project.hasProperty('devScene')) {
                property 'shaderscompanion.devScene', project.property('devScene')
            }
            // -PdevWait=1200: ticks the scenes wait before saving (160 by default; Distant Horizons needs about 1200).
            if (project.hasProperty('devWait')) {
                property 'shaderscompanion.devWait', project.property('devWait')
            }
            // -PdevQuit: logs the status at the title screen and quits (for checking the bundled pack's install).
            if (project.hasProperty('devQuit')) {
                property 'shaderscompanion.devQuit', 'true'
            }
            // -PdevPitch=25: how far the pool scene looks down, in degrees (50 by default).
            if (project.hasProperty('devPitch')) {
                property 'shaderscompanion.devPitch', project.property('devPitch')
            }
            // -PdevYaw=90: which way the ocean scene looks, in degrees (by default the way the ocean runs farthest).
            if (project.hasProperty('devYaw')) {
                property 'shaderscompanion.devYaw', project.property('devYaw')
            }
            // -PdevToggle=WATER_WAVE_FILTER: a shader pack on/off option (or config.<name>, the mod's own) timed in alternating rounds.
            if (project.hasProperty('devToggle')) {
                property 'shaderscompanion.devToggle', project.property('devToggle')
            }
            // -PdevBurst=6: shots per -PdevToggle round, on consecutive ticks (flicker shows as change between them).
            // -PdevCells: logs the mirror plane search's grid, how much of each cell rays reach water in (outline/collider)
            if (project.hasProperty('devCells')) {
                property 'shaderscompanion.devCells', 'true'
            }
            if (project.hasProperty('devBurst')) {
                property 'shaderscompanion.devBurst', project.property('devBurst')
            }
            // -PdevPan=0.15: the camera turns that many degrees a tick during each round's burst (flicker while moving).
            if (project.hasProperty('devPan')) {
                property 'shaderscompanion.devPan', project.property('devPan')
            }
            // -PdevPanTicks=10: -PdevPan turns only for the first 10 ticks of each burst, then the camera holds still.
            if (project.hasProperty('devPanTicks')) {
                property 'shaderscompanion.devPanTicks', project.property('devPanTicks')
            }
            // -PdevMeadowBlocks: the meadow scene with blocks, glowstone and a tree instead of plants (nothing sways).
            if (project.hasProperty('devMeadowBlocks')) {
                property 'shaderscompanion.devMeadowBlocks', 'true'
            }
            // -PdevStrafe: the player walks left during each -PdevToggle round's burst.
            if (project.hasProperty('devStrafe')) {
                property 'shaderscompanion.devStrafe', 'true'
            }
            // -PdevShowHand: the hand, held item and HUD stay drawn in the scenes.
            if (project.hasProperty('devShowHand')) {
                property 'shaderscompanion.devShowHand', 'true'
            }
            // -PdevLeakLog=N: log the first N light samples the light leak fix leaves out (AoFaceDataMixin).
            if (project.hasProperty('devLeakLog')) {
                property 'shaderscompanion.devLeakLog', project.property('devLeakLog')
            }
            // -PdevOutlineBlock=minecraft:cobweb: the hand scene places that block just ahead, before the wall (for the selection outline).
            // -PdevBlockz: Better Blockz and Lathe loaded (see the dependencies); the lampglass scene adds their blocks
            if (project.hasProperty('devBlockz')) {
                property 'shaderscompanion.devBlockz', 'true'
            }
            if (project.hasProperty('devOutlineBlock')) {
                property 'shaderscompanion.devOutlineBlock', project.property('devOutlineBlock')
            }
            // -PdevHold=minecraft:golden_sword -PdevHold2=minecraft:glass_bottle: the hand scene's main and off hand items; -PdevHandRoom: the hand scene closed in, lit by lanterns at night.
            if (project.hasProperty('devHold')) {
                property 'shaderscompanion.devHold', project.property('devHold')
            }
            // -PdevTaczGun=tacz:glock_17: the gun the hand scene holds with -PdevTacz (tacz:ak47 by default)
            if (project.hasProperty('devTaczGun')) {
                property 'shaderscompanion.devTaczGun', project.property('devTaczGun')
            }
            // -PdevTaczSight=tacz:sight_rmr_dot: that sight on the gun; -PdevTaczAim: aiming down it
            if (project.hasProperty('devTaczSight')) {
                property 'shaderscompanion.devTaczSight', project.property('devTaczSight')
            }
            // -PdevEntityMaterials: the mobs scene with armour, a minecart, a dropped block and a vehicle in front
            if (project.hasProperty('devEntityMaterials')) {
                property 'shaderscompanion.devEntityMaterials', 'true'
            }
            // -PdevDoorsOpen: the doorwall scene's doors and trapdoor open
            if (project.hasProperty('devDoorsOpen')) {
                property 'shaderscompanion.devDoorsOpen', 'true'
            }
            // -PdevDoorwallDark: no lantern inside the doorwall scene's room
            if (project.hasProperty('devDoorwallDark')) {
                property 'shaderscompanion.devDoorwallDark', 'true'
            }
            // -PdevDoorwallSolid: wall blocks in place of the doorwall scene's doors and trapdoor (the reference)
            if (project.hasProperty('devDoorwallSolid')) {
                property 'shaderscompanion.devDoorwallSolid', 'true'
            }
            // -PdevDoorwallBacked: the wall block right behind the doorwall scene's doors
            if (project.hasProperty('devDoorwallBacked')) {
                property 'shaderscompanion.devDoorwallBacked', 'true'
            }
            if (project.hasProperty('devTaczAim')) {
                property 'shaderscompanion.devTaczAim', 'true'
            }
            if (project.hasProperty('devHold2')) {
                property 'shaderscompanion.devHold2', project.property('devHold2')
            }
            if (project.hasProperty('devHandRoom')) {
                property 'shaderscompanion.devHandRoom', 'true'
            }
            // -PdevNamespace=mdm: the showroom scene's mod; -PdevResourceReload: resources reloaded after the second toggle round.
            if (project.hasProperty('devNamespace')) {
                property 'shaderscompanion.devNamespace', project.property('devNamespace')
            }
            if (project.hasProperty('devResourceReload')) {
                property 'shaderscompanion.devResourceReload', 'true'
            }
            // -PdevFacadeDist=50: how far ahead the facade scene's glass stands.
            if (project.hasProperty('devFacadeSize')) {
                property 'shaderscompanion.devFacadeSize', project.property('devFacadeSize')
            }
            if (project.hasProperty('devFacadeDist')) {
                property 'shaderscompanion.devFacadeDist', project.property('devFacadeDist')
            }
            // -PdevMetal: the match scene with metal, gem and quartz blocks in place of its bricks, logs, wool and
            // leaves, and a chest (for the material classes in the glass, and block entities with an override file)
            if (project.hasProperty('devMetal')) {
                property 'shaderscompanion.devMetal', 'true'
            }
            // -PdevNoFacade: the shore scene without its glass facade (the water is mirrored).
            if (project.hasProperty('devNoFacade')) {
                property 'shaderscompanion.devNoFacade', 'true'
            }
            // -PdevTime=15000: the time of day of the ocean and shore scenes (6000, noon, by default).
            if (project.hasProperty('devTime')) {
                property 'shaderscompanion.devTime', project.property('devTime')
            }
            // -PdevCycle: the exposure scene lets the time of day run; -PdevEvery=200 and -PdevShots=13: its shot spacing in
            // ticks and count.
            if (project.hasProperty('devCycle')) {
                property 'shaderscompanion.devCycle', 'true'
            }
            if (project.hasProperty('devEvery')) {
                property 'shaderscompanion.devEvery', project.property('devEvery')
            }
            if (project.hasProperty('devShots')) {
                property 'shaderscompanion.devShots', project.property('devShots')
            }
            // -PdevStep=500: the exposure scene sets the time that much later before each next shot.
            if (project.hasProperty('devStep')) {
                property 'shaderscompanion.devStep', project.property('devStep')
            }
            // -PdevTag=p19: a name for the bright scene's screenshots.
            if (project.hasProperty('devTag')) {
                property 'shaderscompanion.devTag', project.property('devTag')
            }
            // -PdevBoat=minecraft:oak_boat: the boat scene's vehicle (Superb Warfare's speed boat by default, with -PdevSbw).
            if (project.hasProperty('devBoat')) {
                property 'shaderscompanion.devBoat', project.property('devBoat')
            }
            // -PdevBlocks: Lathe and BetterBlockZ loaded (see dependencies); the street scene builds its shop front from them.
            if (project.hasProperty('devBlocks')) {
                property 'shaderscompanion.devBlocks', 'true'
            }
            // -PdevImport=<file>: the street scene also places the blocks listed in the file ("dx dy dz state" per line,
            // from a scan of the user's world) at -PdevImportAt (x,y,z from the street's base, "-8,0,-30" by default);
            // the ocean scene places them on the ocean with their own heights (see DevRun).
            // -PdevCorridorFloor, -PdevCorridorLamp, -PdevCorridorSmall=true, -PdevCorridorEnd: the corridor scene's blocks.
            // -PdevDoorwallBlock=<block>: the doorwall scene's walls, floor and ceiling (minecraft:iron_block for metal).
            // -PdevRow=a;b;c: the materials scene places single blocks of those states instead of its vanilla row;
            // -PdevProbe=mekanism,superbwarfare: it also writes the inference's evidence for every block of those mods
            // to research/materials-probe.tsv.
            ['devCamX', 'devCamY', 'devCamZ', 'devShallow', 'devNightVision', 'devImport', 'devImportAt', 'devCorridorFloor', 'devCorridorLamp', 'devCorridorSmall', 'devCorridorEnd',
             'devRow', 'devProbe', 'devDoorwallBlock'].each { name ->
                if (project.hasProperty(name)) {
                    property "shaderscompanion.${name}", project.property(name)
                }
            }
            // -PdevTrunk: the ocean scene gets a walkway and a cherry tree just ahead of it (things uncovered behind a
            // trunk while strafing, with -PdevStrafe).
            if (project.hasProperty('devTrunk')) {
                property 'shaderscompanion.devTrunk', 'true'
            }
            if (project.hasProperty('devGlassFacing')) {
                property 'shaderscompanion.devGlassFacing', project.property('devGlassFacing')
            }
            // -PdevGlass: the ocean scene surrounded by light grey stained glass (water seen through glass).
            if (project.hasProperty('devGlass')) {
                property 'shaderscompanion.devGlass', 'true'
            }
            // -PdevTacz: TaCZ loaded (see dependencies); the mirror scene then holds a gun and wears armour, and every
            // render type the entity capture is asked for is logged.
            if (project.hasProperty('devTacz')) {
                property 'shaderscompanion.devTacz', 'true'
                property 'shaderscompanion.logTypes', 'true'
            }
            // -PdevPoison: the boat scene fills the vertex slots Oculus's converter leaves unwritten with a vertex just
            // above the crosshair, so the Superb Warfare boat bug shows on a fresh client (LeftoverVertexProbe).
            if (project.hasProperty('devPoison')) {
                property 'shaderscompanion.devPoison', 'true'
            }
            // -PdevNoShaders: scenes start without waiting for the mod to draw (for a run with shaders turned off).
            if (project.hasProperty('devNoShaders')) {
                property 'shaderscompanion.devNoShaders', 'true'
            }
            // -PdevReloads=4: the meadow scene reloads the shader pack that many times before its shots.
            if (project.hasProperty('devReloads')) {
                property 'shaderscompanion.devReloads', project.property('devReloads')
            }
            // -PdevShadersLate=600: the world loads with shaders off and they come on that many ticks in.
            if (project.hasProperty('devShadersLate')) {
                property 'shaderscompanion.devShadersLate', project.property('devShadersLate')
            }
            // -PdevRain: rain from 30 ticks into a scene (the ocean scene's biome has rain).
            if (project.hasProperty('devRain')) {
                property 'shaderscompanion.devRain', 'true'
            }
            // -PdevJfr=research/city.jfr: a Java Flight Recorder profile of the run, for finding CPU costs.
            if (project.hasProperty('devJfr')) {
                jvmArg "-XX:StartFlightRecording=filename=${project.file(project.property('devJfr'))},settings=profile"
            }
            // -PdevScene=far (the far-terrain baseline, M0): a high vantage over mountains and sea in its own world, kept between
            // runs (run/saves/shaderscompanion-far, Distant Horizons' database in it); -PdevFarSearch logs candidate vantages
            // and quits; -PdevFarFill instead checks how fast LODs fill fresh terrain (a fresh world, held still then flown at
            // 30 blocks a second); -PdevFarChunky=1024 has Chunky (-PdevChunky) generate real chunks that far around the
            // vantage first; -PdevFarSettle=200 (ticks per round before timing), -PdevFillHold=4800, -PdevFillFly=2400.
            if (project.hasProperty('devFarSearch')) {
                property 'shaderscompanion.devFarSearch', 'true'
            }
            if (project.hasProperty('devFarFill')) {
                property 'shaderscompanion.devFarFill', 'true'
            }
            // -PdevFarFreeze: the far scene pauses Distant Horizons' generation (its API), timing the LODs it already has.
            if (project.hasProperty('devFarFreeze')) {
                property 'shaderscompanion.devFarFreeze', 'true'
            }
            ['devFarChunky', 'devFarSettle', 'devFillHold', 'devFillFly'].each { name ->
                if (project.hasProperty(name)) {
                    property "shaderscompanion.${name}", project.property(name)
                }
            }
            if (project.hasProperty('devDh')) {
                property 'shaderscompanion.devDh', 'true'
            }
            // -PdevProfile: per-pass GPU and CPU times next to every timing line (dev-only mixins in src/verify, never shipped).
            if (project.hasProperty('devProfile')) {
                property 'shaderscompanion.devProfile', 'true'
                args '--mixin.config', 'shaderscompanion-verify.mixins.json'
            }
            // -PdevSize=1920x1009: the game window's size (854 x 480 by default).
            if (project.hasProperty('devSize')) {
                var size = project.property('devSize').toString().split('x')
                args '--width', size[0], '--height', size[1]
            }
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

repositories {
    // Oculus and Embeddium are read from libs/ (see README).
    flatDir { dir 'libs' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Compiled against, and loaded in the dev runs. Never packed into this mod's jar.
    implementation fg.deobf("local:oculus:${oculus_version}")
    implementation fg.deobf("local:embeddium:${embeddium_version}")
    // Distant Horizons is optional: compiled against for its LOD buffers (only its own classes are used), loaded in
    // dev runs only with -PdevDh.
    compileOnly files("libs/distanthorizons-${distanthorizons_version}.jar")
    // TaCZ is optional too: compiled against so the mixin processor finds its first-person gun renderer
    // (TaczFirstPersonMixin, applied only when TaCZ is installed); loaded in dev runs only with -PdevTacz.
    compileOnly fg.deobf("local:tacz:1.1.8")
    if (project.hasProperty('devDh')) {
        runtimeOnly fg.deobf("local:distanthorizons:${distanthorizons_version}")
    }
    // -PdevChunky: the user's Chunky (libs/chunky-1.3.146.jar, the instance's Chunky-1.3.146.jar), for pre-generating the
    // far scene's world (-PdevFarChunky=R).
    if (project.hasProperty('devChunky')) {
        runtimeOnly fg.deobf("local:chunky:1.3.146")
    }
    // -PdevFurniture: the user's Modern Furniture Forked (libs/modern-furniture-fixed-1.0.2.jar from the instance's mods),
    // for airy furniture shapes such as the bathroom radiator (-PdevOutlineBlock=mdm:bathroom_radiator[part=main]).
    if (project.hasProperty('devFurniture')) {
        runtimeOnly fg.deobf("local:modern-furniture-fixed:1.0.2")
    }
    // -PdevBlockz: Better Blockz and Lathe (libs/betterblockz-0.2.10.jar and libs/lathe-0.3.0.jar from the instance's
    // mods), the blocks of the user's buildings: lit "stone" blocks beside Lathe's tinted glass slabs, and nearly
    // every Better Blockz block sounding like metal.
    if (project.hasProperty('devBlockz')) {
        runtimeOnly fg.deobf("local:betterblockz:0.2.10")
        runtimeOnly fg.deobf("local:lathe:0.3.0")
    }
    // -PdevMek: Mekanism and Mekanism Generators (libs/mekanism-10.4.16.80.jar and libs/mekanismgenerators-10.4.16.80.jar,
    // the instance's Mekanism-1.20.1-10.4.16.80.jar and MekanismGenerators-1.20.1-10.4.16.80.jar renamed): machines
    // drawn partly by block entity renderers, for the material system's inference (the machines scene).
    if (project.hasProperty('devMek')) {
        runtimeOnly fg.deobf("local:mekanism:10.4.16.80")
        runtimeOnly fg.deobf("local:mekanismgenerators:10.4.16.80")
    }
    // Superb Warfare is loaded in dev runs only with -PdevSbw (the boat scene): its jar without the nested ones, and
    // the mods it needs (SimpleBedrockModel, GeckoLib, Curios, Cloth Config, Ponder, Flywheel) remapped, its script
    // library as it is. Kotlin for Forge goes in run/mods. HANDOFF "Build and test" says where each jar comes from.
    if (project.hasProperty('devSbw')) {
        runtimeOnly fg.deobf("local:superbwarfare:0.8.9.2")
        runtimeOnly fg.deobf("local:simplebedrockmodel:2.5.1")
        runtimeOnly fg.deobf("local:geckolib:4.8.4")
        runtimeOnly fg.deobf("local:curios:5.14.1")
        runtimeOnly fg.deobf("local:clothconfig:11.1.136")
        runtimeOnly fg.deobf("local:ponder:1.0.91")
        runtimeOnly fg.deobf("local:flywheel:1.0.5")
        minecraftLibrary files('libs/rhino-1.8.1-SNAPSHOT.jar')
    }
    // -PdevBlocks: Lathe and BetterBlockZ (libs/lathe-0.3.0.jar, libs/betterblockz-0.2.10.jar from the instance's mods),
    // for the street scene's shop window built from the user's own glass and frame blocks.
    if (project.hasProperty('devBlocks')) {
        runtimeOnly fg.deobf("local:lathe:0.3.0")
        runtimeOnly fg.deobf("local:betterblockz:0.2.10")
    }
    // -PdevSbwFix=1.1.1: the user's Superb Warfare Performance Fix too, libs/superbwarfareperformancefix-<version>.jar
    // (copied from ../superbwarfare-performance-patch/build/libs), for checking its fixes with Oculus.
    if (project.hasProperty('devSbwFix')) {
        runtimeOnly fg.deobf("local:superbwarfareperformancefix:${project.property('devSbwFix')}")
    }
    // TaCZ is loaded in dev runs only with -PdevTacz: its jar without the nested ones, SimpleBedrockModel remapped (the
    // version the instance resolves), its script and maths libraries as they are. MixinExtras comes with Forge.
    if (project.hasProperty('devTacz')) {
        runtimeOnly fg.deobf("local:tacz:1.1.8")
        if (!project.hasProperty('devSbw')) {
            runtimeOnly fg.deobf("local:simplebedrockmodel:2.5.1")
        }
        minecraftLibrary files('libs/luaj-core-3.0.8.jar', 'libs/luaj-jse-3.0.8.jar', 'libs/commons-math3-3.6.1.jar', 'libs/bcel-6.6.1.jar')
        // -PdevTaczAccel: the user's TaCZ:Accel addon (libs/taczaccel-1.3.2.jar) and the Quantified API it needs
        // (libs/quantified-2.2.4.jar), both as the instance has them
        if (project.hasProperty('devTaczAccel')) {
            runtimeOnly fg.deobf("local:taczaccel:1.3.2")
            runtimeOnly fg.deobf("local:quantified:2.2.4")
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    // The bundled shader pack (see gradle.properties): the ABZA Shader repo's Shaders Companion copy (its reflection
    // options on in every preset), stored without spaces in its name
    var bundledPack = file("${bundled_pack_dir}/ABZA Shader v${bundled_pack_version}-companion.zip")
    inputs.property 'bundled_pack_version', bundled_pack_version
    doFirst {
        if (!bundledPack.isFile()) {
            throw new GradleException("The bundled shader pack is missing: ${bundledPack}. Build it in the ABZA Shader repo (python tools/build.py ${bundled_pack_version}) or set bundled_pack_version.")
        }
    }
    from(bundledPack) {
        into 'bundled'
        rename { 'abza-shader.zip' }
    }
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            oculus_version_range: oculus_version_range, embeddium_version_range: embeddium_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
            mod_version: mod_version, mod_authors: mod_authors, mod_description: mod_description,
            mod_url: mod_url, mod_issues: mod_issues, bundled_pack_version: bundled_pack_version,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'bundled/pack.properties']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors,
                'MixinConfigs'            : "${mod_id}.mixins.json",
        ])
    }
    from('LICENSE') {
        rename { "LICENSE_${mod_id}" }
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// The mixin refmap is written only when the mixin classes are compiled, and deleted every time compileJava runs. An
// incremental compile that recompiles nothing (a build after a run with -PdevSbw, which changes the classpath) left
// the jar without it: 0.6.4 loaded, but its frame hook never attached outside the dev client. So always compile in
// full, compile again when the refmap is gone, and stop the build if the jar's refmap is missing or doesn't name the
// game's own methods.
tasks.named('compileJava', JavaCompile).configure {
    options.incremental = false
    var refmap = new File(temporaryDir, "${mod_id}.refmap.json")
    outputs.upToDateWhen { refmap.isFile() }
}

tasks.register('checkJar') {
    dependsOn 'jar', 'reobfJar'
    doLast {
        var jarFile = tasks.named('jar', Jar).get().archiveFile.get().asFile
        var refmapName = "${mod_id}.refmap.json"
        var zip = new java.util.zip.ZipFile(jarFile)
        try {
            var entry = zip.getEntry(refmapName)
            if (entry == null) {
                throw new GradleException("${jarFile.name} has no ${refmapName}: its mixins would do nothing in the real game. Run gradlew clean build.")
            }
            var refmap = zip.getInputStream(entry).getText('UTF-8')
            // GameRenderer.renderLevel and LevelRenderer.renderLevel, the frame hook's method and call; RenderBuffers.bufferSource
            for (name in ['m_109089_', 'm_109599_', 'm_110104_']) {
                if (!refmap.contains(name)) {
                    throw new GradleException("${refmapName} in ${jarFile.name} doesn't map ${name}: the frame hook would not attach in the real game.")
                }
            }
        } finally {
            zip.close()
        }
        logger.lifecycle("checkJar: ${jarFile.name} has its mixin refmap.")
    }
}

tasks.named('build').configure {
    dependsOn 'checkJar'
}
