org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

mod_id=shaderscompanion
mod_name=Shaders Companion
mod_version=0.5.0
mod_group_id=com.rinkynooble.shaderscompanion
mod_authors=RinkyNooble
mod_license=0BSD
mod_description=Draws extra views of the world (all around the camera, and mirrored in water and glass) into textures shader packs can read, so reflections can show what is off screen. Needs Oculus and Embeddium. Comes with ABZA Shader, which uses them, installed as shaderpacks/ABZA Shader.zip.
mod_url=https://github.com/RinkyDinkyNooble/shaders-companion
mod_issues=https://github.com/RinkyDinkyNooble/shaders-companion/issues

minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.10
forge_version_range=[47,)
loader_version_range=[47,)

# The jars in libs/ that this is compiled against, and the lowest versions it supports.
oculus_version=1.8.0
oculus_version_range=[1.8.0,)
embeddium_version=0.3.31
embeddium_version_range=[0.3.31,)
# Optional: drawn when installed (its internals are read, so only 3.3.2 is known to work).
distanthorizons_version=3.3.2

# The shader pack the jar carries and installs as shaderpacks/ABZA Shader.zip: ABZA Shader's zip as tools/build.py
# writes it in the ABZA Shader repo, copied into the jar unchanged.
bundled_pack_version=1.0.19
bundled_pack_dir=../abza-shader/dist
